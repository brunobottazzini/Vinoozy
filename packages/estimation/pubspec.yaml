name: estimation
description: >-
  Pure Dart drinking-window, status and pairing estimation for Vinoozy
  (contract C2 v1). No Flutter, no Firebase, no I/O.
# Local package used by the app through a path dependency; never published.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.7

# No production dependencies (NFR4.1, security-design.md §1): this section
# must stay empty; tool/check_estimation_purity.sh fails otherwise.
dependencies:

dev_dependencies:
  benchmark_harness: ^2.4.0
  coverage: ^1.16.0
  lints: ^6.1.0
  test: ^1.33.0

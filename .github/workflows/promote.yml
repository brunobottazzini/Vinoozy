# Manual promotion to production (cicd-pipeline.md §3). The play-production
# environment requires the owner's approval, given only after the smoke test
# of docs/release-checklist.md. `halt` is the rollback (§6).
name: promote

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: versionCode already on the internal testing track
        required: true
        type: string
      fraction:
        description: '1.0 for the first release; 0.2 is for subsequent updates only'
        required: true
        type: choice
        options: ['0.2', '1.0']
        default: '1.0'
      action:
        description: promote, complete (100%) or halt (stop the rollout)
        required: true
        type: choice
        options: [promote, complete, halt]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-production
    permissions:
      contents: read
      actions: read # the firebase-deploy.yml runs, for the rules check
    env:
      VERSION_CODE: ${{ inputs.versionCode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build-<versionCode> and v* tags for the rules check
      - name: Validate the input
        run: |
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "versionCode must be a number" >&2; exit 1; }
      # u7-sharing (cicd-pipeline.md §2): an app version never reaches
      # production with rules or indexes other than the deployed ones. The
      # last successful firebase-deploy.yml run names its ref in its run name;
      # the blobs of firestore.rules and firestore.indexes.json there must
      # equal those of the build-<versionCode> commit. Not run for "halt".
      - name: The rules of the build are the deployed ones
        if: inputs.action != 'halt'
        env:
          GH_TOKEN: ${{ github.token }}
          # Features whose new writes test/rules/compat/ may skip against the
          # production rules until they are deployed: this check covers them.
          # `cellar` (u4-cellar cicd-pipeline.md §2): every wine creation
          # carries matchKey, which the earlier rules refuse. `account`
          # (u8-account NFR4.5): deletionStartedAt and the deletion of
          # users and cellars, which the earlier rules refuse. `origin`
          # (ux-redesign R-01): the `country` field of a wine, which the
          # earlier rules refuse. `level-override` (label-autofill-windows
          # BR5.3, NFR1.5): `level`, `windowOverride` and the new window
          # values (`grape`, the foreign qualifiers, `denominationKey`,
          # `tablesVersion`), which the earlier rules refuse.
          # wine-style-profiles (BR10.3): style, sources, the bottling or
          # disgorgement month, migrationVersion and the windows in months.
          # freemium-plus (FR2.2): the active-wine counter (`activeWineCount`,
          # `activeOpWineId`) written on the cellar with every change of a
          # wine's active state, which the earlier rules refuse.
          RULES_FEATURES: sharing cellar account origin level-override style-profiles freemium
        run: |
          title="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/firebase-deploy.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].display_title // empty')"
          deployed_ref="${title#firebase-deploy }"
          if [[ -z "$title" || ! "$deployed_ref" =~ ^[A-Za-z0-9._+/-]+$ ]]; then
            echo "No successful firebase-deploy.yml run found: deploy the rules first with firebase-deploy.yml" >&2
            exit 1
          fi
          deployed_sha="$(git rev-parse --verify "$deployed_ref^{commit}")"
          build_sha="$(git rev-list -n 1 "build-$VERSION_CODE")"
          for file in firestore.rules firestore.indexes.json; do
            if [[ "$(git rev-parse "$build_sha:$file")" != "$(git rev-parse "$deployed_sha:$file")" ]]; then
              echo "$file of build-$VERSION_CODE differs from the deployed one ($deployed_ref): deploy the rules first with firebase-deploy.yml" >&2
              exit 1
            fi
          done
          echo "Rules and indexes of build-$VERSION_CODE match the deployment of $deployed_ref"
      # label-recognition review R-02: the offline wine database of the build
      # is the real Open Food Facts one, never the hand-written sample of
      # tool/fixtures/ (at least 5000 wines, source not "sample"). The
      # manifest is read from the build-<versionCode> commit, the one being
      # promoted. Checked before Google Play is asked anything; not run for
      # "halt". The internal testing track (deploy on merge) does not run it.
      - name: The wine database of the build is a release one
        if: inputs.action != 'halt'
        run: |
          manifest="$RUNNER_TEMP/wine_db_manifest.json"
          git show "build-$VERSION_CODE:assets/wine_db/manifest.json" > "$manifest"
          tool/check_wine_db_release.sh "$manifest"
      # label-autofill-windows BR3.6, BR6.3: the appellation table of the
      # build comes from the real registers (at least 1500 appellations),
      # never the sample built with --allow-sample, and its manifest describes
      # the generated file the app uses (review R-04). Not run for "halt".
      - name: The appellation table of the build is a release one
        if: inputs.action != 'halt'
        run: |
          manifest="$RUNNER_TEMP/appellations_manifest.json"
          generated="$RUNNER_TEMP/appellations.g.dart"
          git show "build-$VERSION_CODE:packages/estimation/lib/src/generated/appellations_manifest.json" > "$manifest"
          git show "build-$VERSION_CODE:packages/estimation/lib/src/generated/appellations.g.dart" > "$generated"
          tool/check_appellations_release.sh "$manifest" "$generated"
      - name: Write the Play credentials
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_PRODUCTION_SA_JSON }}
        run: |
          umask 077
          echo "PLAY_SA_JSON_FILE=$RUNNER_TEMP/play-production.json" >> "$GITHUB_ENV"
          printf '%s' "$PLAY_SA_JSON" > "$RUNNER_TEMP/play-production.json"
      - name: Run ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          FRACTION: ${{ inputs.fraction }}
        run: |
          case "$ACTION" in
            promote) tool/play_api.sh promote "$VERSION_CODE" "$FRACTION" ;;
            complete) tool/play_api.sh complete "$VERSION_CODE" ;;
            halt) tool/play_api.sh halt "$VERSION_CODE" ;;
          esac
      - name: Remove the credentials
        if: always()
        run: rm -f "$PLAY_SA_JSON_FILE"

  # After a completed rollout: tag v<versionName>+<versionCode> on the commit
  # of build-<versionCode>. The versionCode in the tag avoids collisions when
  # one versionName ships twice (Infrastructure Design review 2).
  tag:
    needs: production
    if: inputs.action == 'complete' || (inputs.action == 'promote' && inputs.fraction == '1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ inputs.versionCode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the release commit
        run: |
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || exit 1
          commit="$(git rev-list -n 1 "build-$VERSION_CODE")"
          name="$(git show "$commit:pubspec.yaml" | grep -E '^version:' | sed -E 's/version: *([^+]+).*/\1/')"
          tag="v${name}+${VERSION_CODE}"
          git tag "$tag" "$commit"
          git push origin "$tag"
          echo "Tagged $tag on $commit"

# CI on every push and every pull request to main (cicd-pipeline.md §1).
# No job uses secrets, so fork pull requests run the same checks. All seven
# check jobs are required status checks of the protected main branch.
name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Work branches cancel superseded runs; every merge on main completes, so no
  # merge is skipped by release.yml.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FIREBASE_ENV: demo

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes=
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  # The repository becomes public for the account deletion page (u8): every
  # push scans the whole history for secrets with gitleaks (CI Pipeline Q3).
  # Pinned release binary checked against the published SHA-256; no token,
  # no licence key, no third-party action.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history for secrets
        # --verbose prints each finding (secret redacted) with its fingerprint,
        # the value an accepted finding needs in .gitleaksignore.
        # --log-opts=HEAD: only the history of the commit under test. The
        # gh-pages branch (pages.yml) holds only copies of files already in
        # main, so it is scanned through main; scanning it again would flag the
        # accepted public keys under each new publication commit.
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 --log-opts=HEAD .'

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      # Wine catalog (u3 NFR4.3, NFR5.1): no Open Food Facts contact in the
      # repository or the workflows, no email in lib/, no Firestore in
      # lib/catalog/, a pure-Dart lib/catalog/core/.
      - run: tool/check_off_config.sh
      # Dashboard (u5 NFR4.1): lib/dashboard/ reads only, no Firebase or
      # write repositories, a pure-Dart domain/; then the check of the check,
      # which must pass on an ok/ fixture and fail on a bad/ one.
      - run: tool/check_dashboard_readonly.sh
      - run: tool/check_dashboard_readonly_test.sh
      # Cellar (u4 NFR7.2): every rule BR1.1-BR1.20 is in a test name, BR1.10
      # never counting as BR1.1; then the check of the check (ok/ passes,
      # missing_br1_1/ fails).
      - run: tool/check_rule_ids.sh BR1. 20 test/cellar test/rules/u4.rules.test.mjs
      - run: tool/check_rule_ids_test.sh
      # Label photo (u6 NFR7.2): every rule BR1.1-BR1.15 is in a test name.
      - run: tool/check_rule_ids.sh BR1. 15 test/label
      # Label photo (u6 NFR4.1, NFR5.2): no Firestore or Storage import in
      # lib/label/; then the check of the check (ok/ passes,
      # firestore_import/ fails).
      - run: tool/check_label_imports.sh
      - run: tool/check_label_imports_test.sh
      # Google Lens (label-recognition NFR3.3): the FileProvider is not
      # exported and exposes only cache/label/, <queries> names only the
      # Google app and ACTION_SEND image/*; then the check of the check
      # (ok/ passes, bad/ fails on each problem).
      - run: tool/check_lens_manifest.sh
      - run: tool/check_lens_manifest_test.sh
      # Wine database (label-recognition review R-02): only the check of the
      # check runs here, on fixtures (a real-looking manifest passes, the
      # sample and fewer than 5000 wines fail). The check itself runs in
      # promote.yml, before production; the sample is allowed on internal.
      - run: tool/check_wine_db_release_test.sh
      # Appellation table (label-autofill-windows BR3.6, BR6.3): the same,
      # for the table generated from eAmbrosia; the sample built with
      # --allow-sample is refused by promote.yml before production.
      - run: tool/check_appellations_release_test.sh
      # Play delivery (actions-release-fix FR3.4): the input check of
      # release.yml and promote.yml, and the error messages of
      # tool/play_api.sh, on fake fixtures and stubs of gcloud and curl.
      - run: tool/check_release_inputs_test.sh
      - run: tool/play_api_test.sh
      # Account (u8 NFR7.2): every rule BR1.1-BR1.13 is in a test name.
      - run: tool/check_rule_ids.sh BR1. 13 test/account test/rules/u8.rules.test.mjs
      # Account deletion page (u8 NFR4.7, infrastructure-specification.md
      # "Seconda correzione"): app.bundle.js rebuilt with the pinned esbuild
      # and firebase is identical, scripts only local, CSP with exactly the
      # allowed origins, three languages; then the check of the check.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: tool/check_web_pins.sh
      - run: tool/check_web_pins_test.sh
      # The check pages.yml runs on firebase-config.js before publishing
      # (review R-04): its test, which also proves the placeholders in the
      # repository are refused.
      - run: tool/check_web_config_test.sh
      - name: Publication material structure (drafts allowed)
        run: node tool/check_publication.mjs --draft
      # NFR4.7: no production configuration or signing material in the repo.
      - name: No production config or keystores committed
        run: |
          if git ls-files | grep -E '(^|/)google-services\.json$|config/firebase_prod\.json$|\.jks$|\.keystore$'; then
            echo "Production configuration or signing material is committed" >&2
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    # Flutter tests, native Robolectric tests and two release builds plus one
    # profile build (freemium-plus) on a fresh runner also download/compile
    # the Android dependencies.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: flutter pub get
      # NFR7.1: every file of lib/ counts, untested files as 0%.
      - run: dart run tool/gen_coverage_helper.dart
      - run: flutter test --coverage
      # freemium-plus FR5.2: the hidden sequence of the developer tools is
      # compiled only with ENABLE_DEV_CHEATS=true (a constant, FR5.7), so its
      # tests are skipped above and run here with the flag.
      - name: Developer tools tests (ENABLE_DEV_CHEATS=true)
        run: flutter test --dart-define=ENABLE_DEV_CHEATS=true test/dev/ui
      # Project coverage (80%, no exclusions) counts the estimation package
      # too: its lcov is appended to the app's (u2 cicd-pipeline.md §3).
      - name: Estimation package coverage
        working-directory: packages/estimation
        run: |
          dart pub get
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - run: cat coverage/lcov.info packages/estimation/coverage/lcov.info > coverage/merged.lcov.info
      - run: tool/check_coverage.sh 80 coverage/merged.lcov.info
      # Wine catalog (u3 NFR7.1, label-recognition NFR4.1): lib/catalog/
      # alone at 80% too, the offline wine database included. The speed of
      # the database (NFR2.1, NFR2.2, NFR2.7) is measured by the `benchmark`
      # tests of test/catalog/offline/, run by `flutter test` above; the
      # build tool tests (test/tool/) never download the Open Food Facts
      # export (NFR5.8).
      - run: tool/check_coverage.sh 80 coverage/lcov.info lib/catalog/
      # Dashboard (u5 team.md, Copertura): lib/dashboard/ alone at 80% too.
      - run: tool/check_coverage.sh 80 coverage/lcov.info lib/dashboard/
      # Sharing (u7 NFR7.1): lib/sharing/ alone at 80% too.
      - run: tool/check_coverage.sh 80 coverage/lcov.info lib/sharing/
      # Cellar (u4 NFR7.1): lib/cellar/ alone at 80% too.
      - run: tool/check_coverage.sh 80 coverage/lcov.info lib/cellar/
      # Label photo (u6 NFR7.1): lib/label/ alone at 80% too.
      - run: tool/check_coverage.sh 80 coverage/lcov.info lib/label/
      # Account (u8 NFR7.1): lib/account/ alone at 80% too.
      - run: tool/check_coverage.sh 80 coverage/lcov.info lib/account/
      # Wine catalog speed gate (u3 NFR1.1, NFR1.2, NFR1.4, NFR1.5, NFR7.4):
      # re-runs a measure once when over its threshold, exits 1 on a second
      # breach.
      - run: dart run benchmark/catalog_benchmark.dart
      # Dashboard speed gate (u5 NFR2.2): compute on 500 wines <= 10 ms,
      # median of 10 after 3 warm-up rounds, one re-run, then exit 1.
      - run: dart run benchmark/dashboard_benchmark.dart
      # Cellar speed gate (u4 NFR2.1, NFR2.4): filters on 500 wines <= 20 ms,
      # effective window on 500 wines <= 5 ms, one re-run, then exit 1.
      - run: dart run benchmark/cellar_benchmark.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
      # Step 13 build test: the release build must not contain the E2E hooks
      # nor the Dashboard PERF signal (u5); since freemium-plus also not the
      # developer panel (FR5.7), with a third build (profile +
      # ENABLE_DEV_CHEATS) as its positive control, and Play Billing and
      # AD_ID expected in the merged manifest.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # Label photo (u6 NFR4.4, NFR4.5, NFR8.1): JVM tests of
      # LabelImagePreparer and SharedImageReceiver with Robolectric; the
      # JaCoCo task fails below 80% of their lines.
      - name: Native label tests (Robolectric, JaCoCo 80%)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:jacocoLabelReport
      # Since u6 the build test also checks the merged release manifest
      # (no camera or photo permission, share filter image/* only).
      - run: tool/check_release_build.sh
      # App size (u6 NFR2.3) is not a merge gate: the owner decided on
      # 2026-11-06 that a heavier app is acceptable. tool/check_app_size.sh
      # stays available for a manual measure.

  # Pure Dart estimation package (u2-estimation, cicd-pipeline.md §1):
  # format, analysis, purity, tests, 90% coverage of lib/ and the speed gate.
  estimation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/estimation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: ../../tool/check_estimation_purity.sh
      - run: dart test --coverage=coverage
      - run: |
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          ../../tool/check_coverage.sh 90 coverage/lcov.info
      # Speed gate (NFR2.1 a, NFR2.2, NFR2.3): the script re-runs a measure
      # once when it is over its threshold and exits 1 on a second breach.
      - run: dart run benchmark/estimation_benchmark.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: estimation-coverage
          path: packages/estimation/coverage/lcov.info
          retention-days: 14

  rules:
    runs-on: ubuntu-latest
    # freemium-plus: + the functions and admin-script suites on the emulators.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # v* tags for the compatibility tests
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # package.json is the only list of the rules test files (u7-sharing
      # cicd-pipeline.md §1): U1, U7 (6x9 matrix, transitions, counter,
      # fields, identity), U4 (wine fields, backfill, drinks update and
      # delete, cellar flag), U8 (users and cellars deletion,
      # deletionStartedAt, the whole deletion) and the compatibility with the
      # deployed versions.
      - run: npm run test:rules
      # freemium-plus D4, NFR5: the Cloud Functions (compiled with tsc
      # strict, then mocha against the Firestore, Auth and Functions
      # emulators with a fake Play and a fake Cloud Billing) and the owner's
      # admin scripts (grant_plus, set_policy, migrate_capacity in --emulator
      # mode). Tests only: no workflow ever deploys the functions (FR9.1).
      - run: npm ci --prefix functions
      - run: npm run test:functions
      - run: npm ci --prefix tool/admin
      - run: npm run test:admin
      # u8 NFR7.6: the account deletion page against the Firestore and Auth
      # emulators (rules of this commit loaded explicitly, Google sign-in
      # simulated), c8 at 80% of the lines of account-deletion.js, and the
      # bundle in headless Chromium (start, no CSP error).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      # u7 NFR4.7 and u4 NFR4.8: the collection-group index of the
      # invitations and the composite index of the History, then the check
      # of the check (ok.json passes, missing.json and missing_history.json
      # fail, each with its own message).
      - run: tool/check_firestore_indexes.sh
      - run: tool/check_firestore_indexes_test.sh

  e2e:
    runs-on: ubuntu-latest
    # freemium-plus: + one more app build (developer tools) for
    # tool/e2e_freemium.sh, and the R8-shrunk release build started by
    # tool/check_release_launch.sh (0.2.0 crashed at start on the phone).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: npm ci
      # freemium-plus Step 18: the Functions emulator serves the callables
      # of the demo build, and tool/e2e_freemium.sh gifts Plus with the
      # owner's grant_plus.mjs in --emulator mode.
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: npm ci --prefix tool/admin
      - run: flutter pub get
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd/*
            ~/.android/adb*
          key: e2e-${{ runner.os }}-api34-${{ hashFiles('pubspec.lock', 'android/**/*.kts') }}
      - name: Start the Firebase emulators (Auth + Firestore + Functions, demo-vinoozy)
        run: |
          npx firebase emulators:start --only auth,firestore,functions --project demo-vinoozy > emulators.log 2>&1 &
          for i in $(seq 1 90); do
            # The Functions emulator has loaded functions/lib when the CLI
            # prints this line, after Auth and Firestore answer.
            grep -q 'All emulators ready' emulators.log \
              && curl -sf http://127.0.0.1:8080 >/dev/null \
              && curl -sf http://127.0.0.1:9099 >/dev/null && exit 0
            sleep 2
          done
          cat emulators.log
          exit 1
      # The Android emulator reaches the runner's loopback as 10.0.2.2.
      # After the in-process tests, tool/e2e_force_stop.sh kills the app with
      # `adb shell am force-stop`, restarts it with `adb shell am start` and
      # checks the wine queued offline is still there and syncs (NFR6.1,
      # NFR6.3). android-emulator-runner stops at the first failing line.
      - name: End-to-end tests (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Build and Test 2026-11-07: with the default single core every
          # step was 5-10x slower and the timed tests failed. The free Linux
          # runners have 4 vCPU and 16 GB.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          # freemium_test.dart is skipped in the first run (no developer
          # tools) and runs in tool/e2e_freemium.sh with ENABLE_DEV_CHEATS.
          script: |
            touch e2e-started
            flutter test integration_test --dart-define=FIREBASE_ENV=demo --dart-define=E2E=true
            tool/e2e_force_stop.sh
            tool/e2e_freemium.sh
            tool/check_release_launch.sh
      # One automatic retry only when the Android emulator never booted (an
      # infrastructure error); a test failure is never retried.
      - name: End-to-end tests (retry after an emulator boot failure)
        if: steps.attempt1.outcome == 'failure' && hashFiles('e2e-started') == ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Build and Test 2026-11-07: with the default single core every
          # step was 5-10x slower and the timed tests failed. The free Linux
          # runners have 4 vCPU and 16 GB.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: |
            flutter test integration_test --dart-define=FIREBASE_ENV=demo --dart-define=E2E=true
            tool/e2e_force_stop.sh
            tool/e2e_freemium.sh
            tool/check_release_launch.sh
      - name: Fail when the tests failed
        if: steps.attempt1.outcome == 'failure' && hashFiles('e2e-started') != ''
        run: exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: emulators-log
          path: emulators.log
          retention-days: 7
